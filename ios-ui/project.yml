name: VibeDidactics
options:
  bundleIdPrefix: com.vibedidactics
  deploymentTarget:
    iOS: "17.0"
targets:
  VibeDidactics:
    type: application
    platform: iOS
    sources:
      - VibeDidactics
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access is required to explain your code out loud (Feynman Technique)."
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is required to capture code snippets or architecture diagrams."
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vibedidactics.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
